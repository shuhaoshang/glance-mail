<script>
  // Preserve bookmarks from the original Foundations icon gallery.
  {
    const url = new URL(window.location.href);
    const path = url.searchParams.get('path');
    if (
      path &&
      /^\/(?:story|docs)\/foundations-icons--(?:gallery|standalone|docs)$/.test(
        path,
      )
    ) {
      url.searchParams.set(
        'path',
        path.replace('foundations-icons--', 'primitives-icons--'),
      );
      window.history.replaceState(window.history.state, '', url);
    }
  }
</script>
