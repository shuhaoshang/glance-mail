<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0 }
a { color: #4A3FD0 }
a:hover { color: #3529B0 }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #5A4FE0; outline-offset: 2px }
@keyframes glance-in { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: none } }
@keyframes glance-sweep { from { background-size: 0% 100% } to { background-size: 100% 100% } }
@keyframes glance-ring { from { box-shadow: 0 0 0 1.5px transparent } to { box-shadow: 0 0 0 1.5px var(--ring) } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important }
}
</style>
</head><body><!-- Generated from the Glance design canvas. The small script at the bottom is a stand-in runtime for the prototype only; it is not app code. --><template id="tpl">

<div style="font-family: Inter, system-ui, sans-serif; color: #16151C; background: #F4F4F7; min-height: 1200px; padding: 24px 32px 48px; box-sizing: border-box">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">

<nav aria-label="Demo controls" style="background: #16151C; color: #FFFFFF; border-radius: 16px; padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<span style="display: flex; flex-direction: column; margin-right: auto">
<span style="font-size: 12px; line-height: 16px; font-weight: 600">Demo controls</span>
<span style="font-size: 12px; line-height: 16px; color: #B9B6C8">Not part of the product</span>
</span>
<div role="group" aria-label="Persona" style="display: flex; gap: 4px; background: #2A2833; border-radius: 999px; padding: 4px">
<sc-for list="{{personas}}" as="pp" hint-placeholder-count="3">
<sc-if value="{{pp.current}}" hint-placeholder-val="{{false}}"><span aria-current="page" style="font-size: 14px; line-height: 20px; font-weight: 600; color: #16151C; background: #FFFFFF; border-radius: 999px; padding: 8px 12px">{{pp.label}}</span></sc-if>
<sc-if value="{{pp.other}}" hint-placeholder-val="{{true}}"><a href="{{pp.href}}" style="font-size: 14px; line-height: 20px; font-weight: 600; color: #FFFFFF; text-decoration: none; border-radius: 999px; padding: 8px 12px">{{pp.label}}</a></sc-if>
</sc-for>
</div>
<div role="group" aria-label="Show the brief as" style="display: flex; gap: 4px; background: #2A2833; border-radius: 999px; padding: 4px">
<sc-for list="{{levels}}" as="lv" hint-placeholder-count="3">
<button type="button" aria-pressed="{{lv.pressed}}" onClick="{{lv.go}}" style="font: inherit; font-size: 14px; line-height: 20px; font-weight: 600; color: {{lv.fg}}; background: {{lv.bg}}; border: none; border-radius: 999px; padding: 8px 12px; cursor: pointer; transition: background-color 160ms ease, color 160ms ease"><span style="color: {{lv.numFg}}">{{lv.num}}</span>  {{lv.label}}</button>
</sc-for>
</div>
<button type="button" onClick="{{simulate}}" style="font: inherit; font-size: 14px; line-height: 20px; font-weight: 600; color: #FFFFFF; background: transparent; border: 1px dashed #6E6A80; border-radius: 999px; padding: 8px 16px; min-height: 44px; cursor: pointer">{{simLabel}}</button>
</nav>

<header style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 18px; line-height: 24px; font-weight: 700; letter-spacing: -0.03em">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#5A4FE0" aria-hidden="true"><path d="M12 2C12.6 7.5 16.5 11.4 22 12C16.5 12.6 12.6 16.5 12 22C11.4 16.5 7.5 12.6 2 12C7.5 11.4 11.4 7.5 12 2Z"></path></svg>glance</span>
<button type="button" aria-label="Account and settings" style="width: 44px; height: 44px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: flex-end; cursor: pointer">
<span style="width: 32px; height: 32px; border-radius: 50%; background: #E3ECFF; color: #1D4BAE; font-size: 14px; line-height: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{pr.initial}}</span>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; line-height: 20px; font-weight: 500; color: #6A6875">{{pr.date}}</span>
<h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.03em">{{pr.greeting}}</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #4A4856">{{coverage}}</p>
<sc-if value="{{pr.hasNote}}" hint-placeholder-val="{{false}}">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: #6A6875"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6A6875" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>{{pr.note}}</span>
</sc-if>
</div>
</header>

<sc-if value="{{isL1}}" hint-placeholder-val="{{false}}">
<section aria-label="Brief as plain text" style="max-width: 720px; background: #FFFFFF; border-radius: 20px; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 8px; animation: glance-in 240ms ease both">
<span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #6A6875">Your inbox summary</span>
<p style="margin: 0; font-size: 16px; line-height: 28px; color: #2B2933">{{l1}}</p>
</section>
</sc-if>

<sc-if value="{{isL2}}" hint-placeholder-val="{{false}}">
<section aria-label="Brief as formatted text" style="max-width: 720px; background: #FFFFFF; border-radius: 20px; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 24px; color: #2B2933; animation: glance-in 240ms ease both">
<h2 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 700; color: #16151C">Needs you</h2>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{l2.needs}}" as="ln" hint-placeholder-count="3"><li><strong style="font-weight: 600; color: #16151C">{{ln.lead}}</strong>{{ln.text}}</li></sc-for>
</ul>
<h2 style="margin: 4px 0 0; font-size: 20px; line-height: 28px; font-weight: 700; color: #16151C">Good to know</h2>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{l2.know}}" as="lk" hint-placeholder-count="2"><li>{{lk.text}}</li></sc-for>
</ul>
<sc-if value="{{l2.hasDone}}" hint-placeholder-val="{{true}}">
<h2 style="margin: 4px 0 0; font-size: 20px; line-height: 28px; font-weight: 700; color: #16151C">Done</h2>
<ul style="margin: 0; padding-left: 20px">
<sc-for list="{{l2.done}}" as="ld" hint-placeholder-count="1"><li>{{ld.text}}</li></sc-for>
</ul>
</sc-if>
<p style="margin: 4px 0 0; color: #6A6875">{{l2.setAside}}</p>
</section>
</sc-if>

<sc-if value="{{isL3}}" hint-placeholder-val="{{true}}">
<div style="display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap">

<div style="flex: 0 1 416px; min-width: 320px; display: flex; flex-direction: column; gap: 32px">

<section aria-label="Needs you" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 4px">
<h2 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -0.01em">Needs you <span style="color: #6A6875; font-weight: 600">{{openCount}}</span></h2>
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: #6A6875">{{doneCount}} of {{totalCount}} done
<span role="img" aria-label="{{doneCount}} of {{totalCount}} actions done" style="width: 64px; height: 4px; border-radius: 999px; background: #E6E3FA; overflow: hidden; display: block"><span style="display: block; width: {{progressPct}}; height: 4px; border-radius: 999px; background: #5A4FE0; transition: width 320ms ease"></span></span></span>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 8px; display: flex; flex-direction: column">
<sc-if value="{{notAdded}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{addNew}}" style="width: 100%; font: inherit; color: #16151C; text-align: left; background: transparent; border: none; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 44px; cursor: pointer">
<span style="width: 16px; display: flex; justify-content: center; flex: none" aria-hidden="true"><span style="width: 8px; height: 8px; border-radius: 50%; background: #5A4FE0"></span></span>
<span style="flex: 1; font-size: 14px; line-height: 20px; font-weight: 600">{{newMail.label}}</span>
<span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #4A3FD0">Add to brief</span>
</button>
<div style="height: 1px; background: #ECECF1; margin: 4px 12px" aria-hidden="true"></div>
</sc-if>
<sc-if value="{{justAdded}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 44px; box-sizing: border-box; animation: glance-in 240ms ease both">
<span style="width: 16px; flex: none" aria-hidden="true"></span>
<span style="flex: 1; font-size: 14px; line-height: 20px; color: #6A6875">{{newMail.added}}</span>
</div>
<div style="height: 1px; background: #ECECF1; margin: 4px 12px" aria-hidden="true"></div>
</sc-if>
<sc-for list="{{list}}" as="it" hint-placeholder-count="3">
<div style="overflow: hidden; max-height: {{it.maxH}}; opacity: {{it.op}}; transition: max-height 240ms ease 80ms, opacity 160ms ease">
<button type="button" onClick="{{it.pick}}" aria-pressed="{{it.current}}" style="width: 100%; text-align: left; font: inherit; color: #16151C; border: none; border-radius: 12px; padding: 12px; background: {{it.rowBg}}; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; transition: background-color 160ms ease">
<span style="flex: none; width: 16px; font-size: 14px; line-height: 24px; font-weight: 600; color: {{it.rankFg}}">{{it.rank}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><span style="font-size: 16px; line-height: 24px; font-weight: 600">{{it.name}}</span><sc-if value="{{it.hasAccount}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4A4856; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D9D8E0; border-radius: 999px; padding: 2px 8px">{{it.account}}</span></sc-if><sc-if value="{{it.isNew}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4A3FD0; background: #EEECFD; border-radius: 999px; padding: 2px 8px">New</span></sc-if></span>
<span style="font-size: 14px; line-height: 20px; color: #4A4856; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden"><sc-if value="{{it.isSummary}}" hint-placeholder-val="{{false}}"><span style="color: #5A4FE0; font-weight: 700">✦ </span></sc-if>{{it.ask}}</span>
<span style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px">
<sc-for list="{{it.chips}}" as="c" hint-placeholder-count="2">
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: {{c.fg}}; background: {{c.bg}}; border-radius: 999px; padding: 4px 12px 4px 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.dot}}" aria-hidden="true"></span>{{c.label}}</span>
</sc-for>
</span>
</span>
</button>
</div>
</sc-for>
<sc-if value="{{hasDoneArea}}" hint-placeholder-val="{{true}}">
<sc-if value="{{hasOpen}}" hint-placeholder-val="{{true}}">
<div style="height: 1px; background: #ECECF1; margin: 4px 12px" aria-hidden="true"></div>
</sc-if>
<sc-for list="{{doneBefore}}" as="db" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 44px; box-sizing: border-box">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10" fill="#5A4FE0"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="flex: 1; font-size: 14px; line-height: 20px; color: #6A6875"><strong style="font-weight: 600; color: #4A4856">{{db.name}}</strong> · {{db.note}}</span>
</div>
</sc-for>
<sc-for list="{{doneRows}}" as="d" hint-placeholder-count="0">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 4px 8px 12px; min-height: 44px; box-sizing: border-box; animation: glance-in 240ms ease both">
<sc-if value="{{d.isDone}}" hint-placeholder-val="{{true}}">
<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10" fill="#5A4FE0"></circle><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</sc-if>
<sc-if value="{{d.isMoved}}" hint-placeholder-val="{{false}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6A6875" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path><path d="M12 4v10M8 10l4 4 4-4"></path></svg>
</sc-if>
<sc-if value="{{d.isSnoozed}}" hint-placeholder-val="{{false}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6A6875" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
</sc-if>
<span style="flex: 1; font-size: 14px; line-height: 20px; color: #6A6875"><strong style="font-weight: 600; color: #4A4856">{{d.name}}</strong> · {{d.note}}</span>
<button type="button" onClick="{{d.undo}}" style="font: inherit; font-size: 14px; line-height: 20px; font-weight: 600; color: #4A3FD0; background: transparent; border: none; padding: 8px; min-height: 40px; cursor: pointer">Undo</button>
</div>
</sc-for>
</sc-if>
</div>
</section>

<section aria-label="Good to know" style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; padding: 0 4px; font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -0.01em">Good to know <span style="color: #6A6875; font-weight: 600">{{gtkCount}}</span></h2>
<div style="background: #FFFFFF; border-radius: 20px; padding: 4px 20px">
<sc-for list="{{gtk}}" as="g" hint-placeholder-count="3">
<sc-if value="{{g.notFirst}}" hint-placeholder-val="{{true}}"><div style="height: 1px; background: #ECECF1; margin-left: 44px" aria-hidden="true"></div></sc-if>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0">
<span style="width: 32px; height: 32px; border-radius: 8px; background: {{g.tileBg}}; display: flex; align-items: center; justify-content: center; flex: none" aria-hidden="true">
<sc-if value="{{g.isTag}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{g.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5V4a1 1 0 0 1 1-1h8.5L21 11.5 12 20.5z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg></sc-if>
<sc-if value="{{g.isClock}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{g.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></sc-if>
<sc-if value="{{g.isPeople}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{g.stroke}}" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="3.5"></circle><circle cx="17" cy="10" r="2.5"></circle><path d="M3 19c.8-3 3.2-4.5 6-4.5s5.2 1.5 6 4.5M15 15.2c2.3-.5 4.6.6 5.5 3.3"></path></svg></sc-if>
<sc-if value="{{g.isChart}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{g.stroke}}" stroke-width="2" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-6"></path></svg></sc-if>
<sc-if value="{{g.isPackage}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{g.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M4 7.5l8 4.5 8-4.5M12 12v9"></path></svg></sc-if>
<sc-if value="{{g.isMail}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{g.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></sc-if>
</span>
<span style="flex: 1; min-width: 0; font-size: 14px; line-height: 20px"><strong style="font-weight: 600">{{g.title}}</strong><sc-if value="{{g.hasFact}}" hint-placeholder-val="{{true}}">{{g.textPre}}<button type="button" onClick="{{g.toggleSrc}}" aria-pressed="{{g.srcPressed}}" aria-label="{{g.srcAria}}" style="font: inherit; color: #16151C; background: {{g.factBg}}; border: none; border-radius: 4px; padding: 0 2px; margin: 0 -2px; cursor: pointer; text-decoration: underline dotted {{g.factLine}} 2px; text-underline-offset: 4px; transition: background-color 200ms ease">{{g.value}}</button>{{g.textPost}}</sc-if><sc-if value="{{g.noFact}}" hint-placeholder-val="{{false}}">{{g.text}}</sc-if></span>
<sc-if value="{{g.hasAccount}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4A4856; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D9D8E0; border-radius: 999px; padding: 2px 8px; flex: none">{{g.account}}</span></sc-if>
<sc-if value="{{g.isKept}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 16px; color: #6A6875; flex: none">Moved by you</span></sc-if>
<sc-if value="{{g.hasJudgment}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{g.toggle}}" aria-expanded="{{g.expanded}}" style="font: inherit; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: #4A3FD0; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #5A4FE0; border: none; border-radius: 999px; padding: 4px 12px 4px 8px; min-height: 24px; cursor: pointer; flex: none">
<svg width="12" height="12" viewBox="0 0 24 24" fill="#5A4FE0" aria-hidden="true"><path d="M12 2C12.6 7.5 16.5 11.4 22 12C16.5 12.6 12.6 16.5 12 22C11.4 16.5 7.5 12.6 2 12C7.5 11.4 11.4 7.5 12 2Z"></path></svg>{{g.jLabel}}</button>
</sc-if>
</div>
<sc-if value="{{g.open}}" hint-placeholder-val="{{false}}">
<div style="margin: 0 0 12px 44px; background: #F7F7FA; border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; animation: glance-in 200ms ease both">
<span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #4A3FD0">Glance’s read <span style="font-weight: 500; color: #6A6875">· not stated in the email</span></span>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #2B2933">{{g.jRead}}</p>
<span style="margin-top: 4px; font-size: 14px; line-height: 20px; color: #6A6875">Based on · {{g.jFrom}} · {{g.jWhen}}</span>
<p style="margin: 0; font-size: 16px; line-height: 28px; color: #2B2933">{{g.jPre}}<span style="background-image: linear-gradient(#E3DEFF, #E3DEFF); background-repeat: no-repeat; background-size: 100% 100%; border-radius: 4px; padding: 2px; animation: glance-sweep 480ms cubic-bezier(0.2, 0.7, 0.2, 1) 120ms both">{{g.jHl}}</span>{{g.jPost}}</p>
</div>
</sc-if>
<sc-if value="{{g.srcOpen}}" hint-placeholder-val="{{false}}">
<div style="margin: 0 0 12px 44px; background: #F7F7FA; border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; animation: glance-in 200ms ease both">
<span style="font-size: 14px; line-height: 20px; color: #6A6875">Source · {{g.sFrom}} · {{g.sWhen}}</span>
<p style="margin: 0; font-size: 16px; line-height: 28px; color: #2B2933">{{g.sPre}}<span style="background-image: linear-gradient({{g.srcInk}}, {{g.srcInk}}); background-repeat: no-repeat; background-size: 100% 100%; border-radius: 4px; padding: 2px; animation: glance-sweep 480ms cubic-bezier(0.2, 0.7, 0.2, 1) 120ms both">{{g.sHl}}</span>{{g.sPost}}</p>
</div>
</sc-if>
</sc-for>
</div>
</section>

<button type="button" onClick="{{openSetAside}}" aria-pressed="{{setAsidePressed}}" style="font: inherit; color: #16151C; text-align: left; background: {{setAsideBg}}; border: none; border-radius: 20px; display: flex; align-items: center; gap: 12px; padding: 16px 20px; min-height: 72px; cursor: pointer; transition: background-color 160ms ease">
<span style="flex: 1; display: flex; flex-direction: column">
<span style="font-size: 16px; line-height: 24px; font-weight: 600">{{setAsideCount}} set aside</span>
<span style="font-size: 14px; line-height: 20px; color: #6A6875">{{saSummary}}</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8796" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>

</div>

<div style="flex: 1 1 560px; min-width: 0; padding-top: 40px">
<sc-if value="{{showSetAside}}" hint-placeholder-val="{{false}}">
