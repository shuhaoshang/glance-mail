<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0 }
a { color: #4A3FD0 }
a:hover { color: #3529B0 }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #5A4FE0; outline-offset: 2px }
@keyframes glance-in { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: none } }
@keyframes glance-sweep { from { background-size: 0% 100% } to { background-size: 100% 100% } }
@keyframes glance-ring { from { box-shadow: 0 0 0 1.5px transparent } to { box-shadow: 0 0 0 1.5px var(--ring) } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important }
}
</style>
</head><body><template id="tpl">

<div style="font-family: Inter, system-ui, sans-serif; color: #16151C; background: #F4F4F7; padding: 48px 32px 64px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">
<header style="display: flex; flex-direction: column; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 18px; line-height: 24px; font-weight: 700; letter-spacing: -0.03em"><svg width="16" height="16" viewBox="0 0 24 24" fill="#5A4FE0" aria-hidden="true"><path d="M12 2C12.6 7.5 16.5 11.4 22 12C16.5 12.6 12.6 16.5 12 22C11.4 16.5 7.5 12.6 2 12C7.5 11.4 11.4 7.5 12 2Z"></path></svg>glance · design system</span>
<h1 style="margin: 0; font-size: 40px; line-height: 48px; font-weight: 700; letter-spacing: -0.03em">Components</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #4A4856; max-width: 760px">List rows are one uniform component, so the brief scans in seconds. The detail view swaps in a scene card chosen by the email’s structure; every underlined value opens its source. Cards hold only facts from the email; Glance’s judgments live in “Glance’s read”.</p>
</header>
<section style="background: #FFFFFF; border-radius: 20px; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -0.015em">Primitives</h2><div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-top: 1px solid #ECECF1"><h3 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">Button</h3><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px"><button style="font: inherit; border: none; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; font-weight: 600; color: #FFFFFF; background: #5A4FE0; padding: 12px 20px; min-height: 48px">Open in Gmail</button><button style="font: inherit; border: none; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; font-weight: 600; color: #4A3FD0; background: #EEECFD; padding: 12px 16px; min-height: 48px">Ask</button><button style="font: inherit; border: none; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; font-weight: 600; color: #16151C; background: #F0F0F4; padding: 12px 16px; min-height: 48px">Done</button><button style="font: inherit; border: none; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #4A3FD0; background: transparent; padding: 8px; min-height: 40px">Undo</button></div><span style="font-size: 14px; line-height: 20px; color: #6A6875">Primary (one per view) · Tint · Neutral · Text. Heights 48, or 40 inside toolbars.</span></div><div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-top: 1px solid #ECECF1"><h3 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">Fact chip</h3><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: #FFFFFF; background: #C2255C; border-radius: 999px; padding: 4px 12px 4px 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFFFFF"></span>Due tomorrow</span><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; background: #F0F0F4; border-radius: 999px; padding: 4px 12px 4px 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #9A7300"></span>$12 fee</span><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; background: #F0F0F4; border-radius: 999px; padding: 4px 12px 4px 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #C2255C"></span>Mon, 3:30 PM</span><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; background: #F0F0F4; border-radius: 999px; padding: 4px 12px 4px 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2F64D6"></span>120 seats</span></div><span style="font-size: 14px; line-height: 20px; color: #6A6875">List rows show the first two facts. Dot = type; solid pink = urgent.</span></div><div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-top: 1px solid #ECECF1"><h3 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">Labels</h3><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4A4856; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D9D8E0; border-radius: 999px; padding: 2px 8px">Family</span><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #4A3FD0; background: #EEECFD; border-radius: 999px; padding: 2px 8px">New</span><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; line-height: 20px; font-weight: 600; color: #4A3FD0"><svg width="12" height="12" viewBox="0 0 24 24" fill="#5A4FE0"><path d="M12 2C12.6 7.5 16.5 11.4 22 12C16.5 12.6 12.6 16.5 12 22C11.4 16.5 7.5 12.6 2 12C7.5 11.4 11.4 7.5 12 2Z"></path></svg>Glance’s summary<span style="font-weight: 500; color: #6A6875">· not the sender’s words</span></span></div><span style="font-size: 14px; line-height: 20px; color: #6A6875">Account label is outlined (only the less common inbox). New is tinted. ✦ marks Glance’s words.</span></div><div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-top: 1px solid #ECECF1"><h3 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">Field</h3><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; color: #6A6875">Contract</span><span style="font-size: 20px; line-height: 28px; font-weight: 600; text-decoration: underline dotted #9A7300 2px; text-underline-offset: 6px">$48,000/yr</span></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; color: #6A6875">Contract</span><span style="font-size: 20px; line-height: 28px; font-weight: 600; text-decoration: underline dotted #9A7300 2px; text-underline-offset: 6px; background: #FFE49A; border-radius: 4px; padding: 0 4px">$48,000/yr</span></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; color: #6A6875">For</span><span style="font-size: 20px; line-height: 28px; font-weight: 600">Conference travel</span></span></div><span style="font-size: 14px; line-height: 20px; color: #6A6875">A value from the email. Dotted underline in its type colour = it has a source. Selected = inked. No underline = not traceable to a sentence.</span></div><div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-top: 1px solid #ECECF1"><h3 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">Highlighter ink</h3><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px"><span style="font-size: 16px; line-height: 28px"><span style="background: #FFE49A; border-radius: 4px; padding: 2px; ">$12</span> <span style="background: #FFD5E2; border-radius: 4px; padding: 2px; ">by Friday</span> <span style="background: #D6E4FF; border-radius: 4px; padding: 2px; ">Ms. Rivera</span> <span style="background: #E3DEFF; border-radius: 4px; padding: 2px; ">evaluating other vendors</span> <span style="background: #FFE49A; border-radius: 4px; padding: 2px; box-shadow: 0 0 0 1.5px #9A7300;">$12</span></span></div><span style="font-size: 14px; line-height: 20px; color: #6A6875">Money · Time · People · Glance’s evidence · the fact you selected gets a 1.5 px ring.</span></div><div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-top: 1px solid #ECECF1"><h3 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">Date tile · Person · Checkbox · Switch</h3><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px"><span style="width: 56px; height: 56px; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E6E5EC; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: #A8164C">Nov</span><span style="font-size: 24px; line-height: 28px; font-weight: 700">9</span></span><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: #4A4856"><span style="width: 24px; height: 24px; border-radius: 50%; background: #E3ECFF; color: #1D4BAE; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 16px; font-weight: 700">P</span>Priya Shah, Ops Director</span><span style="width: 24px; height: 24px; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #8A8796"></span><span style="width: 24px; height: 24px; border-radius: 8px; background: #5A4FE0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="width: 36px; height: 20px; border-radius: 999px; background: #5A4FE0; position: relative"><span style="position: absolute; top: 2px; left: 18px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></span></span><span style="width: 36px; height: 20px; border-radius: 999px; background: #8A8796; position: relative"><span style="position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></span></span></div></div><div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-top: 1px solid #ECECF1"><h3 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700">Segmented control · Progress · Skeleton</h3><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px"><div style="display: flex; gap: 2px; background: #F0F0F4; border-radius: 999px; padding: 4px"><span style="font-size: 14px; line-height: 20px; font-weight: 600; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,21,28,0.12); border-radius: 999px; padding: 8px 16px">Details</span><span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #6A6875; padding: 8px 16px">Original email</span><span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #6A6875; padding: 8px 16px">Ask</span></div><span style="width: 160px; height: 4px; border-radius: 999px; background: #E6E3FA; overflow: hidden; display: block"><span style="display: block; width: 40%; height: 4px; background: #5A4FE0"></span></span><span style="width: 160px; height: 12px; border-radius: 4px; background: #ECECF1"></span></div></div></section>
<section style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -0.015em; padding: 0 4px">Scene cards</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start">
<sc-for list="{{gallery}}" as="sc" hint-placeholder-count="10">
<div style="background: #FFFFFF; border-radius: 20px; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 12px">
<span style="display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 24px; font-weight: 600">{{sc.rule}}</span><span style="font-size: 14px; line-height: 20px; color: #6A6875">Example: {{sc.example}}</span></span>

<sc-if value="{{sc.isDeal}}" hint-placeholder-val="{{true}}">
<div style="background: #F7F7FA; border-radius: 16px; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 24px">
<span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #6A6875">{{sc.label}}</span>
<sc-if value="{{sc.hasUrgent}}" hint-placeholder-val="{{true}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: #FFFFFF; background: #C2255C; border-radius: 999px; padding: 4px 12px 4px 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFFFFF" aria-hidden="true"></span>{{sc.urgent}}</span></sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{sc.fields}}" as="f" hint-placeholder-count="3">
<sc-if value="{{f.hasFact}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{f.toggle}}" aria-pressed="{{f.pressed}}" aria-label="{{f.aria}}" style="font: inherit; color: #16151C; text-align: left; background: transparent; border: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><span style="font-size: 14px; line-height: 20px; color: #6A6875">{{f.label}}</span><span style="font-size: 20px; line-height: 28px; font-weight: 600; text-decoration: underline dotted {{f.line}} 2px; text-underline-offset: 6px; background: {{f.bg}}; border-radius: 4px; padding: 0 4px; margin: 0 -4px; transition: background-color 200ms ease">{{f.value}}</span></button></sc-if>
<sc-if value="{{f.noFact}}" hint-placeholder-val="{{false}}"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; color: #6A6875">{{f.label}}</span><span style="font-size: 20px; line-height: 28px; font-weight: 600">{{f.value}}</span></span></sc-if>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{sc.isDecision}}" hint-placeholder-val="{{false}}">
<div style="background: #F7F7FA; border-radius: 16px; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 24px">
<span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #6A6875">{{sc.label}}</span>
<sc-if value="{{sc.hasUrgent}}" hint-placeholder-val="{{true}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: #FFFFFF; background: #C2255C; border-radius: 999px; padding: 4px 12px 4px 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFFFFF" aria-hidden="true"></span>{{sc.urgent}}</span></sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{sc.options}}" as="o" hint-placeholder-count="2">
<div style="background: #FFFFFF; border-radius: 12px; box-shadow: inset 0 0 0 1px #E6E5EC; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 24px; height: 24px; border-radius: 50%; background: #F0F0F4; font-size: 12px; line-height: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">{{o.key}}</span><span style="font-size: 16px; line-height: 24px; font-weight: 600">{{o.title}}</span></span>
<sc-if value="{{o.f.hasFact}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{o.f.toggle}}" aria-pressed="{{o.f.pressed}}" aria-label="{{o.f.aria}}" style="font: inherit; color: #16151C; text-align: left; background: transparent; border: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><span style="font-size: 16px; line-height: 24px; font-weight: 600; text-decoration: underline dotted {{o.f.line}} 2px; text-underline-offset: 6px; background: {{o.f.bg}}; border-radius: 4px; padding: 0 4px; margin: 0 -4px; transition: background-color 200ms ease">{{o.f.value}}</span></button></sc-if>
<sc-if value="{{o.f.noFact}}" hint-placeholder-val="{{false}}"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; line-height: 24px; font-weight: 600">{{o.f.value}}</span></span></sc-if>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{sc.isAmount}}" hint-placeholder-val="{{false}}">
<div style="background: #F7F7FA; border-radius: 16px; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 24px">
<span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #6A6875">{{sc.label}}</span>
<sc-if value="{{sc.hasUrgent}}" hint-placeholder-val="{{true}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: #FFFFFF; background: #C2255C; border-radius: 999px; padding: 4px 12px 4px 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFFFFF" aria-hidden="true"></span>{{sc.urgent}}</span></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 32px">
<sc-if value="{{sc.amount.hasFact}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{sc.amount.toggle}}" aria-pressed="{{sc.amount.pressed}}" aria-label="{{sc.amount.aria}}" style="font: inherit; color: #16151C; text-align: left; background: transparent; border: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><span style="font-size: 14px; line-height: 20px; color: #6A6875">{{sc.amount.label}}</span><span style="font-size: 32px; line-height: 40px; font-weight: 700; text-decoration: underline dotted {{sc.amount.line}} 2px; text-underline-offset: 6px; background: {{sc.amount.bg}}; border-radius: 4px; padding: 0 4px; margin: 0 -4px; transition: background-color 200ms ease">{{sc.amount.value}}</span></button></sc-if>
<sc-if value="{{sc.amount.noFact}}" hint-placeholder-val="{{false}}"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; color: #6A6875">{{sc.amount.label}}</span><span style="font-size: 32px; line-height: 40px; font-weight: 700">{{sc.amount.value}}</span></span></sc-if>
<sc-for list="{{sc.fields}}" as="f" hint-placeholder-count="2">
<sc-if value="{{f.hasFact}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{f.toggle}}" aria-pressed="{{f.pressed}}" aria-label="{{f.aria}}" style="font: inherit; color: #16151C; text-align: left; background: transparent; border: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><span style="font-size: 14px; line-height: 20px; color: #6A6875">{{f.label}}</span><span style="font-size: 16px; line-height: 24px; font-weight: 600; text-decoration: underline dotted {{f.line}} 2px; text-underline-offset: 6px; background: {{f.bg}}; border-radius: 4px; padding: 0 4px; margin: 0 -4px; transition: background-color 200ms ease">{{f.value}}</span></button></sc-if>
<sc-if value="{{f.noFact}}" hint-placeholder-val="{{false}}"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; color: #6A6875">{{f.label}}</span><span style="font-size: 16px; line-height: 24px; font-weight: 600">{{f.value}}</span></span></sc-if>
</sc-for>
</div>
<sc-if value="{{sc.hasNote}}" hint-placeholder-val="{{false}}"><span style="font-size: 14px; line-height: 20px; color: #6A6875">{{sc.note}}</span></sc-if>
</div>
</sc-if>

<sc-if value="{{sc.isMismatch}}" hint-placeholder-val="{{false}}">
<div style="background: #F7F7FA; border-radius: 16px; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 24px">
<span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #6A6875">{{sc.label}}</span>
<sc-if value="{{sc.hasUrgent}}" hint-placeholder-val="{{true}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: #FFFFFF; background: #C2255C; border-radius: 999px; padding: 4px 12px 4px 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #FFFFFF" aria-hidden="true"></span>{{sc.urgent}}</span></sc-if>
</div>
<div style="display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<sc-for list="{{sc.compare}}" as="f" hint-placeholder-count="2">
<span style="display: flex; align-items: flex-end; gap: 16px"><sc-if value="{{f.notFirst}}" hint-placeholder-val="{{false}}"><span style="font-size: 24px; line-height: 40px; font-weight: 600; color: #C2255C" aria-label="does not match">≠</span></sc-if>
<sc-if value="{{f.hasFact}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{f.toggle}}" aria-pressed="{{f.pressed}}" aria-label="{{f.aria}}" style="font: inherit; color: #16151C; text-align: left; background: transparent; border: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><span style="font-size: 14px; line-height: 20px; color: #6A6875">{{f.label}}</span><span style="font-size: 32px; line-height: 40px; font-weight: 700; text-decoration: underline dotted {{f.line}} 2px; text-underline-offset: 6px; background: {{f.bg}}; border-radius: 4px; padding: 0 4px; margin: 0 -4px; transition: background-color 200ms ease">{{f.value}}</span></button></sc-if>
<sc-if value="{{f.noFact}}" hint-placeholder-val="{{false}}"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; color: #6A6875">{{f.label}}</span><span style="font-size: 32px; line-height: 40px; font-weight: 700">{{f.value}}</span></span></sc-if></span>
</sc-for>
