<script>
class DCLogic { constructor(p){ this.props=p||{}; this.state={}; } setState(p){ Object.assign(this.state, typeof p==='function'?p(this.state):p); window.__render(); } }
const SRC = "\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n";
const Component = (new Function('DCLogic', SRC + '; return Component;'))(DCLogic);
const comp = new Component({});
const tpl = document.getElementById('tpl');
const look = (path, sc) => path.trim().split('.').reduce((o,k)=> (o==null?undefined:o[k]), sc);
const interp = (s, sc) => s.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (m,p)=>{ const v=look(p,sc); return v==null?'':String(v); });
function render(node, sc, out){
  if (node.nodeType===3){ out.push(document.createTextNode(interp(node.nodeValue, sc))); return; }
  if (node.nodeType!==1) return;
  const tag=node.tagName.toLowerCase();
  if (tag==='sc-for'){ const list=look(node.getAttribute('list').replace(/[{}]/g,''), sc)||[]; const as=node.getAttribute('as');
    list.forEach(it=>{ const s2=Object.assign({},sc,{[as]:it}); node.childNodes.forEach(c=>render(c,s2,out)); }); return; }
  if (tag==='sc-if'){ const v=look(node.getAttribute('value').replace(/[{}]/g,''), sc); if (v) node.childNodes.forEach(c=>render(c,sc,out)); return; }
  const el=(node.namespaceURI==='http://www.w3.org/1999/xhtml')?document.createElement(node.localName):document.createElementNS(node.namespaceURI, node.localName);
  for (const a of node.attributes){
    if (a.name.startsWith('hint-')) continue;
    if (a.name.startsWith('on')){ const fn=look(a.value.replace(/[{}]/g,''), sc); if (typeof fn==='function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); continue; }
    el.setAttribute(a.name, interp(a.value, sc));
  }
  const kids=[]; (node.content||node).childNodes.forEach(c=>render(c,sc,kids)); kids.forEach(k=>el.appendChild(k)); out.push(el);
}
window.__render = () => { const vals=comp.renderVals(); const out=[]; tpl.content.childNodes.forEach(c=>render(c,vals,out)); const root=document.getElementById('root'); root.innerHTML=''; out.forEach(n=>root.appendChild(n)); };
window.__comp = comp;
window.__render();
